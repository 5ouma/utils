name: 🔀 Auto Merge Release PR

on:
  schedule:
    - cron: 0 0 * * SAT

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  auto-merge-release:
    name: 🔀 Auto Merge Release PR
    runs-on: ubuntu-slim
    environment:
      name: Release
      deployment: false
    timeout-minutes: 1

    steps:
      - name: 💳 Create GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3.4.0
        with:
          client-id: ${{ vars.CLIENT_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: read

      - name: 🔀 Auto merge release PR
        uses: actions/github-script@v9.0.0
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const pr = (await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
            })).data.find((pr) => pr.head.ref.startsWith("tagpr-from-") && pr.head.repo.owner.login === context.repo.owner);

            if (!pr || Date.now() - new Date(pr.created_at).getTime() < 30 * 24 * 60 * 60 * 1000) return;

            await github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              commit_title: pr.title.replace("Release:", "chore(release):"),
              merge_method: "squash",
            });
